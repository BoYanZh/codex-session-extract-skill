[project]
name = "codex-session-extract-skill"
version = "1.0.0"
description = "Rollout-only Agent Skill for loading project-scoped Codex CLI session context"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BoYanZh" }]
keywords = ["agent-skills", "codex", "transcript", "developer-tools"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
